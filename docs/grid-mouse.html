<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网格鼠标开场动画 · 原型（grid-mouse）</title>
<!--
  dsh-opening-animation / grid-mouse 引擎的独立可视化原型（ADR-003 引擎设计稿）。
  单文件自包含；默认图片由程序生成（彩色棋盘 + 文字，最能展现格子放大的撕裂错位）。
  本体逻辑与 src/client/animations/grid-mouse.ts 保持一致，改动请两边同步：
    · 每帧 clearRect + 整图 cover 打底，再仅重绘指针 reach 半径内的格子
      （源矩形向格心收缩 = 内容放大，格子足迹不变，网格沿光标轨迹撑开）
    · strength 无下限，目标 = (指针滞后/视口宽)×2（参考项目的 sTo(d/cw*2)），
      指针静止后约一秒衰减到零，整幅画面融回原图
    · 指数平滑：位置 τ=0.15s（≈参考 1s expo quickTo）、强度 τ=1.1s
      （≈参考 2s power2 quickTo）
    · 参考项目的格子角白点刻意未实现
  与引擎的差异（场景所需）：引擎在无人交互的开场自动播放下由八字形自动巡游
  驱动效果；本原型面向人工体验，不内置巡游——静止消散正是要展示的行为之一。
  调试参数：?img=<url> 换图 | ?cell=<px> 换格子边长（默认 85，24–200）
-->
<style>
  html, body { margin: 0; height: 100%; background: #04050e; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; cursor: crosshair; }
  #tip {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    color: rgba(255,255,255,.55); font: 12px/1.6 system-ui, sans-serif;
    letter-spacing: .14em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="tip">移动鼠标驱动网格 · 停住让它融回原图</div>
<script>
"use strict";

const POS_TAU = 0.15;        // s — 位置平滑时间常数（参考 1s expo quickTo）
const STRENGTH_TAU = 1.1;    // s — 强度平滑时间常数（参考 2s power2 quickTo）
const LAG_GAIN = 2;          // 参考项目的 sTo(d/cw*2)
const INITIAL_STRENGTH = 1.5; // 参考项目 m 的初始 s

const params = new URLSearchParams(location.search);
const CELL = Math.min(200, Math.max(24, Number(params.get("cell")) || 85));

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const img = new Image();

let vw = 0, vh = 0, dpr = 1;
let fitScale = 1, fitOx = 0, fitOy = 0;
// 指针目标（真实指针位置）与平滑位置；strength 无下限，静止消散到 0。
const target = { x: 0, y: 0 };
const smooth = { x: 0, y: 0 };
let strength = INITIAL_STRENGTH;
let lastFrameAt = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth;
  vh = window.innerHeight;
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitScale = Math.max(vw / img.naturalWidth, vh / img.naturalHeight);
  fitOx = (vw - img.naturalWidth * fitScale) / 2;
  fitOy = (vh - img.naturalHeight * fitScale) / 2;
  smooth.x = target.x = vw / 2;
  smooth.y = target.y = vh / 2;
}

/* 整图 cover 打底：每帧先画它，受影响格子之外的像素永远是原图。 */
function drawClean() {
  ctx.clearRect(0, 0, vw, vh);
  ctx.drawImage(img, fitOx, fitOy, img.naturalWidth * fitScale, img.naturalHeight * fitScale);
}

function drawFrame() {
  ctx.clearRect(0, 0, vw, vh);
  drawClean();
  const reach = strength * Math.max(vw, 1);
  if (reach < 0.5) return; // 强度耗尽：只有原图
  const half = CELL / 2;
  const col0 = Math.max(0, Math.floor((smooth.x - reach) / CELL));
  const col1 = Math.min(Math.ceil(vw / CELL) - 1, Math.ceil((smooth.x + reach) / CELL));
  const row0 = Math.max(0, Math.floor((smooth.y - reach) / CELL));
  const row1 = Math.min(Math.ceil(vh / CELL) - 1, Math.ceil((smooth.y + reach) / CELL));
  const maxSx = Math.max(0, img.naturalWidth - 1);
  const maxSy = Math.max(0, img.naturalHeight - 1);
  for (let row = row0; row <= row1; row++) {
    for (let col = col0; col <= col1; col++) {
      const dx = col * CELL, dy = row * CELL;
      const d = Math.hypot(dx + half - smooth.x, dy + half - smooth.y);
      const s = 1 - Math.min(Math.max(d / reach, 0), 1);
      if (s < 0.001) continue;
      const inset = (CELL * s) / 2;
      const sw = Math.max((CELL - 2 * inset) / fitScale, 1e-3);
      const sh = Math.max((CELL - 2 * inset) / fitScale, 1e-3);
      const sx = Math.min(Math.max((dx + inset - fitOx) / fitScale, 0), maxSx - sw + 1e-3);
      const sy = Math.min(Math.max((dy + inset - fitOy) / fitScale, 0), maxSy - sh + 1e-3);
      ctx.drawImage(img, Math.max(sx, 0), Math.max(sy, 0), sw, sh, dx, dy, CELL, CELL);
    }
  }
}

function frame(now) {
  const dt = lastFrameAt === 0 ? 1 / 60 : Math.min(0.05, (now - lastFrameAt) / 1000);
  lastFrameAt = now;
  // 位置指数平滑向指针靠拢；剩余滞后（≈速度）就是强度目标，缓速平滑。
  const kp = 1 - Math.exp(-dt / POS_TAU);
  smooth.x += (target.x - smooth.x) * kp;
  smooth.y += (target.y - smooth.y) * kp;
  const lag = Math.hypot(target.x - smooth.x, target.y - smooth.y);
  const strengthTarget = (lag / Math.max(vw, 1)) * LAG_GAIN;
  strength += (strengthTarget - strength) * (1 - Math.exp(-dt / STRENGTH_TAU));
  drawFrame();
  requestAnimationFrame(frame);
}

/* 默认示例图：程序生成的彩色棋盘 + 斜纹 + 文字，格子放大时的错位最直观。
   ?img=<url> 可换成任意图片（同源或允许跨域）。 */
function makeSampleImage() {
  const c = document.createElement("canvas");
  c.width = 1600; c.height = 1000;
  const g = c.getContext("2d");
  g.fillStyle = "#101426";
  g.fillRect(0, 0, 1600, 1000);
  const colors = ["#173F9E", "#E3D1BD", "#141414", "#4C6EF5", "#F76707"];
  for (let y = 0; y < 10; y++) {
    for (let x = 0; x < 16; x++) {
      g.fillStyle = colors[(x * 3 + y * 5) % colors.length];
      g.globalAlpha = 0.85;
      g.fillRect(x * 100 + 6, y * 100 + 6, 88, 88);
      g.globalAlpha = 0.25;
      g.strokeStyle = "#ffffff";
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(x * 100 + 12, y * 100 + 88);
      g.lineTo(x * 100 + 88, y * 100 + 12);
      g.stroke();
    }
  }
  g.globalAlpha = 1;
  g.fillStyle = "rgba(255,255,255,0.92)";
  g.font = "700 150px system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText("GRID · MOUSE", 800, 500);
  return c.toDataURL("image/png");
}

img.onload = () => {
  resize();
  drawClean();
  requestAnimationFrame(frame);
};
img.src = params.get("img") || makeSampleImage();

window.addEventListener("pointermove", (e) => {
  target.x = e.clientX;
  target.y = e.clientY;
});
window.addEventListener("resize", () => {
  if (img.complete && img.naturalWidth > 0) resize();
});
</script>
</body>
</html>
