<html lang="zh">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek 复古像素开机动画 · 原型（retro-boot）</title>
<!--
  dsh-opening-animation / retro-boot 引擎的独立可视化原型（ADR-003 引擎设计稿）。
  单文件自包含：两张 DeepSeek logo 以 base64 data URL 内嵌（logo2 的白底已在
  生成阶段键出为透明，对应引擎资产 retro-boot-assets.ts）。
  1920x1080 设计坐标、等比缩放 letterbox；十秒时间轴状态机：
    0.0-1.5s  背景图暗化铺底，logo2 亮起（透明度/缩放/glow）并转入呼吸脉动
    1.5-4.0s  #5B6EE8 像素方块（40-60px）从四周向中心不规则生长吞噬
    2.5-5.0s  绿色细线嵌套矩形从中心向外逐层扩散（隧道）
    4.9-7.0s  全屏纯 #5B6EE8，交叉淡切 logo1（白 glow + 呼吸）
    7.0-9.0s  十字/回形半调网格从右上蔓延，蓝紫渐变为红/洋红/紫拼贴，
              8.4s 起收缩为左侧红十字片与中右方框红片
    9.0-10.0s 纯黑背景 + 两片暗红网格定格
  播完定格淡出后循环重播（?loop=0 可关闭）。
  调试参数：?t=<秒> 冻结单帧 | ?seed=<n> 换随机种子 | ?bg=<url> 换背景图
  本体逻辑与 src/client/animations/retro-boot.ts 保持一致，改动请两边同步。
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
"use strict";

/* ===== 设计坐标与时间轴（ms） ===== */
const DW = 1920, DH = 1080;
// 素材角色按实际内容分配（任务描述与文件内容互换，已核实）：
//   deepseek-logo1.png = 纯鲸鱼图形（透明）→ 开场"黑底鲸鱼亮起"
//   deepseek-logo2.png = 鲸鱼+deepseek 字标（白底已键出）→ 中段"横版字标定格"
const whale = { img: null };  // deepseek-logo1.png
const word = { img: null };   // deepseek-logo2.png
const TL = {
  logoIn: 1500,        // logo2 亮起完成
  devourStart: 1500,
  devourEnd: 4000,
  tunnelStart: 2500,
  solidStart: 4900,    // 纯色开始覆盖（5.2s 全覆盖）
  swapStart: 4950,     // logo2 -> logo1 交叉淡化
  swapEnd: 5500,
  logo1End: 7800,
  ditherStart: 7000,
  shrinkStart: 8400,
  finalStart: 9000,
  total: 10000,        // 结尾定格 9.0-10.0s
  fadeEnd: 11000,      // 原型循环：10.0-10.8s 淡出后重播
};
const VIOLET = [91, 110, 232];          // #5B6EE8
const PALETTE = [[226, 58, 46], [214, 51, 156], [139, 47, 201]]; // 红/洋红/紫
const DARK_CROSS = [122, 21, 24];
const DARK_BOX = [94, 15, 18];

/* ===== 确定性随机（mulberry32） ===== */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const lerp3 = (a, b, k) => [
  Math.round(a[0] + (b[0] - a[0]) * k),
  Math.round(a[1] + (b[1] - a[1]) * k),
  Math.round(a[2] + (b[2] - a[2]) * k),
];

/* ===== 像素吞噬：种子化块生长表 ===== */
const CELL = 40, COLS = DW / CELL, ROWS = DH / CELL;
function buildDevourCells(seed) {
  const rnd = mulberry32(seed);
  const phase = rnd() * Math.PI * 2;
  const cells = [];
  const cx = (COLS - 1) / 2, cy = (ROWS - 1) / 2;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      // 椭圆波前：四周先长（d≈1）、向中心收拢（d=0 最晚），角落略晚于边中点
      const base = clamp01(1 - Math.hypot((col - cx) / cx, (row - cy) / cy) / 1.05);
      const wave = Math.sin(col * 0.55 + row * 1.15 + phase) * 0.18;
      const noise = (rnd() * 2 - 1) * 0.35;
      const birth = TL.devourStart +
        clamp01(base + wave * 0.5 + noise * 0.55) * (TL.devourEnd - TL.devourStart);
      const v = 0.82 + rnd() * 0.36; // 每块明度抖动 -> 深浅拼贴
      cells.push({
        x: col * CELL, y: row * CELL,
        w: CELL + Math.floor(rnd() * 21), h: CELL + Math.floor(rnd() * 21),
        birth, v, flash: rnd(),
      });
    }
  }
  return cells;
}

/* ===== 绿色嵌套矩形隧道 ===== */
function buildTunnelLayers(seed, count) {
  const rnd = mulberry32((seed ^ 0x9E3779B9) >>> 0);
  const layers = [];
  for (let k = 0; k < count; k++) {
    layers.push({
      start: TL.tunnelStart + k * 300,
      dur: 1800,
      ox: (rnd() - 0.5) * 90,
      oy: (rnd() - 0.5) * 60,
    });
  }
  return layers;
}

/* ===== 半调抖动网格（十字/回形） ===== */
const DCELL = 32, DCOLS = 60, DROWS = 34;
const KEEP = [
  { x0: 130, y0: 320, x1: 640, y1: 760 },   // 左：红色十字网格片
  { x0: 920, y0: 300, x1: 1540, y1: 800 },  // 中右：红色方框网格片
];
function buildDitherGrid(seed) {
  const rnd = mulberry32((seed ^ 0x5F356495) >>> 0);
  const cells = [];
  let maxD = 1;
  for (let row = 0; row < DROWS; row++) {
    for (let col = 0; col < DCOLS; col++) {
      const cx = col * DCELL + DCELL / 2, cy = row * DCELL + DCELL / 2;
      const dTR = Math.hypot((col - (DCOLS - 1)) / (DCOLS - 1), row / (DROWS - 1));
      const keep = KEEP.findIndex((k) => cx >= k.x0 && cx <= k.x1 && cy >= k.y0 && cy <= k.y1);
      let dKeep = Infinity;
      for (const k of KEEP) {
        const dx = Math.max(k.x0 - cx, 0, cx - k.x1);
        const dy = Math.max(k.y0 - cy, 0, cy - k.y1);
        dKeep = Math.min(dKeep, Math.hypot(dx, dy));
      }
      if (dKeep < Infinity) maxD = Math.max(maxD, dKeep);
      cells.push({
        x: col * DCELL, y: row * DCELL,
        // 保留片内图案由区域决定（左片全十字、右片全方框），其余随机混搭
        pattern: keep >= 0 ? keep : (rnd() < 0.5 ? 0 : 1),
        color: PALETTE[Math.floor(rnd() * PALETTE.length)],
        birth: TL.ditherStart + clamp01(dTR + (rnd() - 0.5) * 0.25) * 1080,
        dKeep, keep, deathNoise: rnd(),
      });
    }
  }
  for (const c of cells) {
    c.death = TL.shrinkStart + (c.dKeep / maxD) * 520 + c.deathNoise * 80;
  }
  return cells;
}

/* ===== 画布与 letterbox ===== */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let S = 1, OX = 0, OY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  S = Math.min(canvas.width / DW, canvas.height / DH);
  OX = (canvas.width - DW * S) / 2;
  OY = (canvas.height - DH * S) / 2;
}
window.addEventListener("resize", () => { resize(); if (frozen >= 0) render(frozen); });

/* ===== 分层绘制 ===== */
function drawBackground(t) {
  if (!state.bgOk || t >= TL.solidStart + 300) return;
  const a = Math.min(t / 1200, 1) * 0.55;
  const img = state.bg;
  const s = Math.max(DW / img.naturalWidth, DH / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.drawImage(img, DW / 2 - w / 2, DH / 2 - h / 2, w, h);
  ctx.restore();
}

function drawDevour(t) {
  if (t < TL.devourStart) return;
  for (const c of state.devourCells) {
    if (t < c.birth) continue;
    const v = c.v;
    ctx.fillStyle = `rgb(${Math.round(91 * v)},${Math.round(110 * v)},${Math.round(232 * v)})`;
    ctx.fillRect(c.x, c.y, c.w, c.h);
    const age = t - c.birth;
    if (age < 90) {
      ctx.fillStyle = `rgba(215,224,255,${((1 - age / 90) * 0.8).toFixed(3)})`;
      ctx.fillRect(c.x, c.y, c.w, c.h);
    }
  }
}

function drawTunnel(t) {
  if (t < TL.tunnelStart) return;
  const fade = 1 - clamp01((t - TL.solidStart) / 400);
  if (fade <= 0) return;
  ctx.strokeStyle = "#45FF85";
  for (const L of state.tunnelLayers) {
    const p = (t - L.start) / L.dur;
    if (p <= 0 || p >= 1) continue;
    const scale = 0.06 + p * p * 3.3; // 前慢后快：屏内多框嵌套，后段依次冲出画面
    const w = DW * scale, h = DH * scale;
    ctx.globalAlpha = Math.min(1, p * 9) * (1 - p * 0.45) * fade;
    ctx.lineWidth = 2;
    ctx.strokeRect(DW / 2 - w / 2 + L.ox * p, DH / 2 - h / 2 + L.oy * p, w, h);
  }
  ctx.globalAlpha = 1;
}

function drawLogo2(t) {
  if (t >= TL.swapEnd) return;
  const p = clamp01(t / TL.logoIn);
  const ease = 1 - Math.pow(1 - p, 3);
  let alpha = ease;
  let scale = 0.95 + 0.05 * ease;
  let glow = 18 * ease;
  if (t > TL.logoIn) {
    const ph = ((t - TL.logoIn) / 2400) * Math.PI * 2;
    alpha = 0.9 + 0.1 * Math.sin(ph);
    scale = 1;
    glow = 16 + 10 * (0.5 + 0.5 * Math.sin(ph));
  }
  if (t > TL.swapStart) alpha *= 1 - (t - TL.swapStart) / (TL.swapEnd - TL.swapStart);
  const w = 640 * scale, h = w * 675 / 1200;
  const x = DW / 2 - w / 2, y = DH / 2 - h / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = false; // 复古像素放大
  ctx.shadowColor = t < TL.devourStart ? "rgba(90,140,255,0.9)" : "rgba(255,255,255,0.85)";
  ctx.shadowBlur = glow * S;
  ctx.drawImage(whale.img, x, y, w, h);
  ctx.drawImage(whale.img, x, y, w, h);
  ctx.restore();
}

function drawLogo1(t) {
  if (t < TL.swapStart || t > TL.logo1End) return;
  let alpha = clamp01((t - TL.swapStart) / (TL.swapEnd - TL.swapStart));
  if (t > TL.ditherStart) alpha *= 1 - clamp01((t - TL.ditherStart) / 600);
  const ph = (t / 2400) * Math.PI * 2;
  alpha *= 0.9 + 0.1 * Math.sin(ph);
  const size = 880;
  const x = DW / 2 - size / 2, y = DH / 2 - size / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = false; // 复古像素放大
  ctx.shadowColor = "rgba(255,255,255,0.85)";
  ctx.shadowBlur = (22 + 10 * (0.5 + 0.5 * Math.sin(ph))) * S;
  ctx.drawImage(word.img, x, y, size, size);
  ctx.drawImage(word.img, x, y, size, size);
  ctx.restore();
}

function drawCross(x, y) {
  ctx.fillRect(x + 1, y + 11, 30, 10);
  ctx.fillRect(x + 11, y + 1, 10, 30);
}
function drawBox(x, y) {
  ctx.lineWidth = 3;
  ctx.strokeRect(x + 3.5, y + 3.5, 25, 25);
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 11.5, y + 11.5, 9, 9);
}
function drawDither(t) {
  if (t < TL.ditherStart) return;
  const finalK = clamp01((t - 8800) / 600);
  for (const c of state.ditherCells) {
    if (t < c.birth) continue;
    if (c.keep < 0 && t >= c.death) continue;
    let rgb = lerp3(VIOLET, c.color, clamp01((t - c.birth) / 450));
    if (c.keep >= 0 && finalK > 0) rgb = lerp3(rgb, c.keep === 0 ? DARK_CROSS : DARK_BOX, finalK);
    ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    ctx.strokeStyle = ctx.fillStyle; // 回形描边与填充同色（strokeStyle 无默认继承）
    if (c.pattern === 0) drawCross(c.x, c.y);
    else drawBox(c.x, c.y);
  }
}

/* ===== 状态机合成 ===== */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(OX, OY);
  ctx.scale(S, S);
  ctx.beginPath();
  ctx.rect(0, 0, DW, DH);
  ctx.clip();

  drawBackground(t);
  drawDevour(t);
  drawTunnel(t);
  if (t >= TL.solidStart) {
    ctx.fillStyle = `rgb(${VIOLET.join(",")})`;
    ctx.globalAlpha = Math.min(1, (t - TL.solidStart) / 300);
    ctx.fillRect(0, 0, DW, DH);
    ctx.globalAlpha = 1;
  }
  drawLogo2(t);
  drawLogo1(t);
  const curtain = clamp01((t - TL.shrinkStart) / 400);
  if (curtain > 0) {
    ctx.globalAlpha = curtain;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, DW, DH);
    ctx.globalAlpha = 1;
  }
  drawDither(t);
  const fade = clamp01((t - TL.total) / 800);
  if (fade > 0) {
    ctx.globalAlpha = fade;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, DW, DH);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ===== 装配与播放 ===== */
const qs = new URLSearchParams(location.search);
const seed = Number.parseInt(qs.get("seed") ?? "20261009", 10) || 20261009;
const state = {
  bg: new Image(),
  bgOk: false,
  devourCells: buildDevourCells(seed),
  tunnelLayers: buildTunnelLayers(seed, 5),
  ditherCells: buildDitherGrid(seed),
};
let frozen = -1;
let t0 = 0;
let rafId = 0;

function startClock() {
  t0 = performance.now();
}
function frame(now) {
  const t = now - t0;
  if (t >= TL.fadeEnd) {
    startClock();
    render(0);
  } else {
    render(t);
  }
  rafId = requestAnimationFrame(frame);
}

function boot() {
  resize();
  const ft = qs.get("t");
  if (ft !== null) {
    frozen = Math.max(0, Math.round(parseFloat(ft) * 1000));
    render(frozen);
    return;
  }
  startClock();
  rafId = requestAnimationFrame(frame);
  canvas.addEventListener("click", () => { startClock(); }); // 原型：点击重播
}

function load(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.addEventListener("load", () => resolve(img));
    img.addEventListener("error", () => reject(new Error("image failed: " + src.slice(0, 64))));
    img.src = src;
  });
